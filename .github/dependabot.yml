version: 2
updates:
  - package-ecosystem: composer
    directory: "/"
    schedule:
      interval: daily
    open-pull-requests-limit: 99
    groups:
      composer-security:
        applies-to: security-updates
        update-types:
          - minor
          - patch
      composer-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: daily
    open-pull-requests-limit: 99
    groups:
      npm-security:
        applies-to: security-updates
        update-types:
          - minor
          - patch
      npm-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
    open-pull-requests-limit: 99
    groups:
      github-actions-security:
        applies-to: security-updates
        update-types:
          - minor
          - patch
      github-actions-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
